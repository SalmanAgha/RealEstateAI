name: Deploy RealEstateAI to VPS

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4

    - name: Deploy to VPS using SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          mkdir -p ~/salmanagha.dev
          cd ~/salmanagha.dev
          
          if [ ! -d "realestateai" ]; then
            git clone https://github.com/SalmanAgha/RealEstateAI.git realestateai
            cd realestateai
            git checkout prod || git checkout -b prod
          else
            cd realestateai
            git checkout prod || git checkout -b prod
            git stash
            git pull origin prod
          fi

          # Deploy Backend
          cd backend
          npm install
          npx prisma generate
          pm2 restart realestate-backend || pm2 start src/index.js --name realestate-backend

          # Deploy Python AI Microservice
          cd ../mortgage-api
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          source venv/bin/activate
          pip install -r requirements.txt
          pm2 restart mortgage-api || pm2 start ecosystem.config.js

          # Deploy Frontend
          cd ../frontend
          npm install
          npm run build
          pm2 restart realestate-frontend || pm2 start "npm run start" --name realestate-frontend

          pm2 save
